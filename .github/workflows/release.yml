name: Release

# Push a tag like v1.2.0 to build the installer and publish a GitHub release:
#   git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # The tag name goes through env, never directly into the script (no script injection via tag names)
      - name: Build, test and package
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart("v")
          ./build.ps1 -Version $version

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:TAG (Get-ChildItem artifacts -File).FullName `
            --title $env:TAG --generate-notes
