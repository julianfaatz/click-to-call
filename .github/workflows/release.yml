name: Release

# Push a tag like v1.2.0 to build the installer and publish a GitHub release:
#   git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Fails early if CHANGELOG.md has no section for this version
      - name: Release notes from CHANGELOG.md
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = [regex]::Escape($env:TAG.TrimStart("v"))
          $match = [regex]::Match((Get-Content CHANGELOG.md -Raw),
            "(?ms)^## \[$version\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]:|\z)")
          $notes = $match.Groups[1].Value.Trim()
          if (-not $notes) { throw "CHANGELOG.md has no section for $env:TAG" }
          Set-Content (Join-Path $env:RUNNER_TEMP "release-notes.md") $notes -Encoding utf8

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # The tag name goes through env, never directly into the script (no script injection via tag names)
      - name: Build, test and package
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart("v")
          ./build.ps1 -Version $version

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content artifacts/SHA256SUMS.txt -Encoding ascii

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:TAG (Get-ChildItem artifacts -File).FullName `
            --title $env:TAG --notes-file (Join-Path $env:RUNNER_TEMP "release-notes.md")

  # Opens a pull request at microsoft/winget-pkgs. Skipped until the secret WINGET_TOKEN exists
  # (classic PAT with public_repo and workflow scopes; also needs a fork of microsoft/winget-pkgs
  # and a first version of the package submitted by hand).
  winget:
    needs: release
    runs-on: ubuntu-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        if: env.WINGET_TOKEN != ''
        with:
          identifier: JulianFaatz.ClickToCall
          installers-regex: '-setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
